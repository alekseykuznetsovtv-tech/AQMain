<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Автоквест — Игровой портал</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --input-bg: #2b2b36;
      --accent-color: #ffb703;
      --success-color: #2a9d8f;
      --error-color: #e63946;
      --text-color: #e0e0e0;
      --text-muted: #a0a0b0;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      border: 1px solid #2d2d38;
    }

    h1, h2, h3 {
      color: #fff;
      margin-bottom: 10px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d2d38;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .team-badge {
      font-weight: bold;
      color: var(--accent-color);
    }

    .level-badge {
      background-color: var(--accent-color);
      color: #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9em;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px;
      background-color: var(--input-bg);
      border: 1px solid #3d3d4e;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: #4a4a5a;
      color: #8a8a9a;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #3a3a4c;
      color: #fff;
      margin-top: 8px;
    }

    .clue-text {
      font-size: 1.1em;
      line-height: 1.5;
      white-space: pre-line;
      margin-bottom: 15px;
      background-color: #16161a;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
    }

    .hint-box {
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      background-color: #252530;
      border: 1px dashed #444458;
      font-size: 0.95em;
    }

    .hint-box.active {
      border: 1px solid var(--accent-color);
      background-color: #2b281e;
    }

    .attempts-info {
      font-size: 0.85em;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-align: right;
    }

    .status-msg {
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      background-color: rgba(42, 157, 143, 0.2);
      color: var(--success-color);
      border: 1px solid var(--success-color);
      display: block;
    }

    .status-msg.error {
      background-color: rgba(230, 57, 70, 0.2);
      color: var(--error-color);
      border: 1px solid var(--error-color);
      display: block;
    }

    #finished-navigation {
      display: none;
      background-color: #1a1a24;
      border: 1px solid var(--accent-color);
      padding: 15px;
      border-radius: var(--border-radius);
      margin-bottom: 15px;
    }

    .finished-title {
      color: var(--accent-color);
      text-align: center;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .level-buttons-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .nav-lvl-btn {
      width: auto;
      padding: 8px 14px;
      font-size: 14px;
      background-color: #2b2b38;
      color: #fff;
      border: 1px solid #3d3d50;
      border-radius: 6px;
    }

    .nav-lvl-btn.active {
      background-color: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(0,0,0,.3);
      border-radius: 50%;
      border-top-color: #000;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ЭКРАН АВТОРИЗАЦИИ -->
  <div id="auth-screen" class="card">
    <h2>Вход в игру</h2>
    <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9em;">Введите название вашей команды и ПИН-код для подключения к системе.</p>
    <input type="text" id="auth-team" placeholder="Название команды">
    <input type="password" id="auth-pin" placeholder="ПИН-код">
    <button id="auth-btn" onclick="login()">Войти в систему</button>
    <div id="auth-msg" class="status-msg"></div>
  </div>

  <!-- ОСНОВНОЙ ИГРОВОЙ ЭКРАН -->
  <div id="game-screen" style="display: none;">
    
    <!-- Панель финиша (выбор уровней) -->
    <div id="finished-navigation">
      <div class="finished-title">🏁 Игра завершена! Выберите задание:</div>
      <div id="level-buttons-container" class="level-buttons-grid"></div>
    </div>

    <!-- Карточка задания -->
    <div class="card">
      <div class="header-bar">
        <span class="team-badge" id="display-team-name">Команда</span>
        <span class="level-badge" id="display-level-num">Уровень 1</span>
      </div>

      <h2 id="task-title">Загрузка задания...</h2>
      <div class="clue-text" id="task-clue">Пожалуйста, подождите...</div>

      <!-- Блок подсказок -->
      <div id="hints-container">
        <div id="hint1-box" class="hint-box">
          <div id="hint1-text">Подсказка 1: Загрузка...</div>
          <button id="hint1-btn" class="btn-secondary" style="display:none;" onclick="requestHint(1)">Взять подсказку 1</button>
        </div>
        <div id="hint2-box" class="hint-box" style="margin-top: 8px;">
          <div id="hint2-text">Подсказка 2: Загрузка...</div>
          <button id="hint2-btn" class="btn-secondary" style="display:none;" onclick="requestHint(2)">Взять подсказку 2</button>
        </div>
      </div>
    </div>

    <!-- Форма ввода кода -->
    <div id="code-form-container" class="card" style="margin-top: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3>Ввод кода</h3>
        <span class="attempts-info" id="attempts-left-info">Осталось попыток: 3</span>
      </div>
      <input type="text" id="code-input" placeholder="Введите код (например: 12R34)" autocomplete="off" autocapitalize="characters">
      <button id="submit-code-btn" onclick="submitCode()">Отправить код</button>
      <div id="game-msg" class="status-msg"></div>
    </div>

  </div>

</div>

<script>
  // =================================================================
  // ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШ GOOGLE APPS SCRIPT
  // =================================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymyo45TOB3pzo61x6Vk4v1cG0URU69Xvcv6JsdvjqFzm9MYPDfiucojmM9FpE6igx9Tw/exec";

  // Состояние приложения
  let teamName = localStorage.getItem("quest_team") || "";
  let teamPin = localStorage.getItem("quest_pin") || "";
  
  let currentLevel = 0;
  let selectedReviewLevel = 0;
  let isFinished = false;
  let isSubmitting = false;

  let levelStartTime = 0;
  let hintsTaken = 0;
  let hint1DelayMs = 600000;
  let hint2DelayMs = 1200000;
  let lockoutUntil = 0;
  let wrongAttempts = 0;

  let allGameLevels = [];
  let timerInterval = null;
  let syncInterval = null;

  // Инициализация
  window.onload = function() {
    if (teamName && teamPin) {
      document.getElementById("auth-team").value = teamName;
      document.getElementById("auth-pin").value = teamPin;
      login();
    }
  };

  // Вход в систему
  function login() {
    const t = document.getElementById("auth-team").value.trim();
    const p = document.getElementById("auth-pin").value.trim();

    if (!t || !p) {
      showMsg("auth-msg", "Заполните название команды и ПИН!", "error");
      return;
    }

    teamName = t;
    teamPin = p;

    const btn = document.getElementById("auth-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Вход...';

    fetchState("sync", {}, (data) => {
      btn.disabled = false;
      btn.textContent = "Войти в систему";

      if (data.status === "OK") {
        localStorage.setItem("quest_team", teamName);
        localStorage.setItem("quest_pin", teamPin);

        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";
        document.getElementById("display-team-name").textContent = teamName;

        processServerData(data);

        // Запуск фоновых таймеров
        if (!timerInterval) timerInterval = setInterval(updateTimers, 1000);
        if (!syncInterval) syncInterval = setInterval(backgroundSync, 5000);
      } else {
        showMsg("auth-msg", data.message || "Ошибка входа", "error");
      }
    });
  }

  // Фоновая синхронизация
  function backgroundSync() {
    if (isSubmitting) return;

    fetchState("sync", {}, (data) => {
      if (data && data.status === "OK") {
        processServerData(data);
      }
    });
  }

  // Обработка ответа сервера
  function processServerData(data) {
    allGameLevels = data.levels || [];
    isFinished = !!data.isFinished;
    
    if (!isFinished && data.currentLevel >= currentLevel) {
      currentLevel = data.currentLevel;
    } else if (isFinished) {
      currentLevel = data.currentLevel;
    }

    levelStartTime = data.levelStartTime || levelStartTime;
    hintsTaken = data.hintsTaken !== undefined ? data.hintsTaken : hintsTaken;
    hint1DelayMs = data.hint1DelayMs || hint1DelayMs;
    hint2DelayMs = data.hint2DelayMs || hint2DelayMs;
    lockoutUntil = data.lockoutUntil || lockoutUntil;
    
    if (data.wrongAttempts !== undefined) {
      wrongAttempts = data.wrongAttempts;
    }

    updateAttemptsUI();

    if (isFinished) {
      renderFinishedState();
    } else {
      renderPlayingState();
    }

    updateTimers();
  }

  // Обновление интерфейса попыток
  function updateAttemptsUI() {
    const attemptsLeft = Math.max(0, 3 - wrongAttempts);
    const infoEl = document.getElementById("attempts-left-info");
    if (infoEl) {
      infoEl.textContent = `Осталось попыток: ${attemptsLeft} из 3`;
      if (attemptsLeft === 1) {
        infoEl.style.color = "var(--error-color)";
      } else {
        infoEl.style.color = "var(--text-muted)";
      }
    }
  }

  // Отображение игры (в процессе)
  function renderPlayingState() {
    document.getElementById("finished-navigation").style.display = "none";
    document.getElementById("code-form-container").style.display = "block";

    document.getElementById("display-level-num").textContent = "Уровень " + (currentLevel + 1);

    const levelData = allGameLevels[currentLevel];
    if (levelData) {
      document.getElementById("task-title").textContent = levelData.title || ("Задание " + (currentLevel + 1));
      document.getElementById("task-clue").textContent = levelData.clue || "Нет текста задания";
    }
  }

  // Отображение финиша
  function renderFinishedState() {
    document.getElementById("code-form-container").style.display = "none";
    document.getElementById("finished-navigation").style.display = "block";
    document.getElementById("display-level-num").textContent = "ФИНИШ 🏁";

    const container = document.getElementById("level-buttons-container");
    container.innerHTML = "";

    allGameLevels.forEach((lvl, idx) => {
      const btn = document.createElement("button");
      btn.className = "nav-lvl-btn" + (idx === selectedReviewLevel ? " active" : "");
      btn.textContent = (idx + 1);
      btn.onclick = () => {
        selectedReviewLevel = idx;
        renderFinishedState();
      };
      container.appendChild(btn);
    });

    const reviewData = allGameLevels[selectedReviewLevel];
    if (reviewData) {
      document.getElementById("task-title").textContent = reviewData.title || ("Задание " + (selectedReviewLevel + 1));
      document.getElementById("task-clue").textContent = reviewData.clue || "";

      const h1Box = document.getElementById("hint1-box");
      const h2Box = document.getElementById("hint2-box");
      
      document.getElementById("hint1-btn").style.display = "none";
      document.getElementById("hint2-btn").style.display = "none";

      if (reviewData.hint1) {
        h1Box.style.display = "block";
        h1Box.className = "hint-box active";
        document.getElementById("hint1-text").textContent = "💡 Подсказка 1: " + reviewData.hint1;
      } else {
        h1Box.style.display = "none";
      }

      if (reviewData.hint2) {
        h2Box.style.display = "block";
        h2Box.className = "hint-box active";
        document.getElementById("hint2-text").textContent = "💡 Подсказка 2: " + reviewData.hint2;
      } else {
        h2Box.style.display = "none";
      }
    }
  }

  // Обновление таймеров
  function updateTimers() {
    const now = new Date().getTime();

    const submitBtn = document.getElementById("submit-code-btn");
    const codeInput = document.getElementById("code-input");

    if (!isFinished && lockoutUntil > now) {
      const remSec = Math.ceil((lockoutUntil - now) / 1000);
      submitBtn.disabled = true;
      codeInput.disabled = true;
      showMsg("game-msg", `🚫 БЛОКИРОВКА! Дополнительный ввод через ${remSec} сек.`, "error");
    } else if (!isFinished && !isSubmitting) {
      submitBtn.disabled = false;
      codeInput.disabled = false;
    }

    if (isFinished) return;

    const elapsed = now - levelStartTime;
    const levelData = allGameLevels[currentLevel] || {};

    // Подсказка 1
    const h1Box = document.getElementById("hint1-box");
    const h1Btn = document.getElementById("hint1-btn");
    const h1Text = document.getElementById("hint1-text");

    if (hintsTaken >= 1 && levelData.hint1) {
      h1Box.className = "hint-box active";
      h1Btn.style.display = "none";
      h1Text.textContent = "💡 Подсказка 1: " + levelData.hint1;
    } else {
      const h1Rem = hint1DelayMs - elapsed;
      if (h1Rem <= 0) {
        h1Box.className = "hint-box";
        h1Btn.style.display = "block";
        h1Text.textContent = "Подсказка 1 готова к получению!";
      } else {
        h1Box.className = "hint-box";
        h1Btn.style.display = "none";
        h1Text.textContent = `Подсказка 1 через: ${formatTime(h1Rem)}`;
      }
    }

    // Подсказка 2
    const h2Box = document.getElementById("hint2-box");
    const h2Btn = document.getElementById("hint2-btn");
    const h2Text = document.getElementById("hint2-text");

    if (hintsTaken >= 2 && levelData.hint2) {
      h2Box.className = "hint-box active";
      h2Btn.style.display = "none";
      h2Text.textContent = "💡 Подсказка 2: " + levelData.hint2;
    } else {
      const h2Rem = hint2DelayMs - elapsed;
      if (h2Rem <= 0 && hintsTaken >= 1) {
        h2Box.className = "hint-box";
        h2Btn.style.display = "block";
        h2Text.textContent = "Подсказка 2 готова к получению!";
      } else {
        h2Box.className = "hint-box";
        h2Btn.style.display = "none";
        h2Text.textContent = hintsTaken < 1 ? "Подсказка 2 (сначала возьмите первую)" : `Подсказка 2 через: ${formatTime(h2Rem)}`;
      }
    }
  }

  // Запрос подсказки
  function requestHint(hintNum) {
    fetchState("takeHint", {}, (data) => {
      if (data.status === "OK") {
        processServerData(data);
      }
    });
  }

  // Отправка кода
  function submitCode() {
    const codeEl = document.getElementById("code-input");
    const code = codeEl.value.trim();

    if (!code) {
      showMsg("game-msg", "Введите код!", "error");
      return;
    }

    isSubmitting = true;
    const btn = document.getElementById("submit-code-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Проверка...';

    getGPSLocation((coords, mapUrl) => {
      fetchState("submitCode", { code: code, coords: coords, mapUrl: mapUrl }, (data) => {
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = "Отправить код";

        if (data.status === "OK") {
          if (data.result === "CORRECT" || data.result === "FINISHED") {
            codeEl.value = "";
            showMsg("game-msg", data.message, "success");
            
            if (data.currentLevel !== undefined) {
              currentLevel = data.currentLevel;
            }
            processServerData(data);
          } else {
            showMsg("game-msg", data.message, "error");
            if (data.lockoutUntil) lockoutUntil = data.lockoutUntil;
            processServerData(data);
          }
        } else {
          showMsg("game-msg", data.message || "Ошибка проверки кода", "error");
        }
      });
    });
  }

  // Запросы к Google Apps Script
  function fetchState(action, extraParams, callback) {
    let url = `${SCRIPT_URL}?team=${encodeURIComponent(teamName)}&pin=${encodeURIComponent(teamPin)}&action=${action}`;
    
    for (let key in extraParams) {
      url += `&${key}=${encodeURIComponent(extraParams[key])}`;
    }

    fetch(url)
      .then(res => res.json())
      .then(data => callback(data))
      .catch(err => {
        console.error("Network Error:", err);
        isSubmitting = false;
        callback({ status: "ERROR", message: "Ошибка сети. Проверьте интернет." });
      });
  }

  // Сбор GPS
  function getGPSLocation(callback) {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          const coordsStr = `${lat}, ${lon}`;
          const mapUrl = `https://maps.yandex.ru/?text=${lat},${lon}`;
          callback(coordsStr, mapUrl);
        },
        (err) => {
          callback("Геолокация недоступна", "—");
        },
        { timeout: 5000, enableHighAccuracy: true }
      );
    } else {
      callback("Не поддерживается", "—");
    }
  }

  function showMsg(elementId, text, type) {
    const el = document.getElementById(elementId);
    el.textContent = text;
    el.className = `status-msg ${type}`;
  }

  function formatTime(ms) {
    if (ms <= 0) return "00:00";
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
  }
</script>

</body>
</html>
