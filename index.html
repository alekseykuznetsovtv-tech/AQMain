<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игровой Терминал</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0f12;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: #161a20;
            border: 1px solid #2a303c;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .team-bar {
            font-size: 0.85rem;
            color: #8892b0;
            border-bottom: 1px solid #2a303c;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 12px;
        }
        .task-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #ffffff;
            white-space: pre-line;
            background: #0f1217;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
            margin-bottom: 15px;
            word-break: break-word;
        }
        .task-text a, .hint-box a {
            color: #00ff66;
            text-decoration: underline;
            font-weight: 600;
            word-break: break-all;
        }

        /* БЛОК ПОДСКАЗОК */
        .hint-container {
            margin-bottom: 20px;
        }
        .hint-box {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 10px;
            white-space: pre-line;
            word-break: break-word;
        }
        .hint-1 {
            background: #0f1923;
            border-left: 4px solid #00bfff;
            color: #80d8ff;
        }
        .hint-2 {
            background: #241414;
            border-left: 4px solid #ff4d4d;
            color: #ff9999;
        }
        .hint-timer-info {
            font-size: 0.85rem;
            color: #ffcc00;
            margin-bottom: 8px;
            font-weight: 500;
            text-align: center;
        }
        .hint-btn {
            width: 100%;
            padding: 11px;
            background: #00bfff;
            color: #000;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .hint-btn:disabled {
            background: #2a303c;
            color: #666;
            cursor: not-allowed;
        }

        .prompt-text {
            font-size: 0.95rem;
            color: #a8b2d1;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .code-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            background: #090b0e;
            border: 2px solid #2a303c;
            color: #00ff66;
            text-align: center;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 12px;
        }
        .code-input:disabled {
            background: #1f242d;
            color: #555;
            border-color: #333;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #ffcc00;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .msg {
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            min-height: 24px;
            font-weight: 600;
        }
        .msg-err { color: #ff4d4d; }
        .msg-ok { color: #00ff66; }
    </style>
</head>
<body>

    <div class="container">
        <div class="team-bar">
            <span>Команда: <strong id="teamDisplay" style="color: #fff;">—</strong></span>
            <span id="changeTeamBtn" style="cursor:pointer; text-decoration:underline;">Сменить</span>
        </div>

        <div id="taskTitle" class="task-title">Загрузка...</div>
        <div id="taskText" class="task-text">⏳ Подключение...</div>

        <!-- СЕКЦИЯ ПОДСКАЗОК -->
        <div id="hintContainer" class="hint-container">
            <div id="hint1Box" class="hint-box hint-1" style="display:none;"></div>
            <div id="hint2Box" class="hint-box hint-2" style="display:none;"></div>
            <div id="hintTimerInfo" class="hint-timer-info"></div>
            <button id="hintBtn" class="hint-btn" style="display:none;">ВЗЯТЬ ПОДСКАЗКУ</button>
        </div>

        <!-- ВВОД КОДА -->
        <div id="inputBlock">
            <div class="prompt-text">Для получения следующего задания введите код:</div>
            <input type="text" id="codeInput" class="code-input" placeholder="Введите код..." autocomplete="off">
            <button id="submitBtn" class="btn">ОТПРАВИТЬ КОД</button>
        </div>

        <div id="msgBox" class="msg"></div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymyo45TOB3pzo61x6Vk4v1cG0URU69Xvcv6JsdvjqFzm9MYPDfiucojmM9FpE6igx9Tw/exec";

        let GAME_LEVELS = [];
        let currentLevel = 0;
        let teamName = "";
        let teamPin = "";
        let lockoutTimer = null;
        let hintTimerInterval = null;
        let isLocked = false;

        let levelStartTime = 0;
        let hintsTaken = 0;
        let hint1DelayMs = 10 * 60 * 1000;
        let hint2DelayMs = 20 * 60 * 1000;

        const taskTitle = document.getElementById('taskTitle');
        const taskText = document.getElementById('taskText');
        const codeInput = document.getElementById('codeInput');
        const submitBtn = document.getElementById('submitBtn');
        const msgBox = document.getElementById('msgBox');
        const teamDisplay = document.getElementById('teamDisplay');

        const hint1Box = document.getElementById('hint1Box');
        const hint2Box = document.getElementById('hint2Box');
        const hintBtn = document.getElementById('hintBtn');
        const hintTimerInfo = document.getElementById('hintTimerInfo');
        const hintContainer = document.getElementById('hintContainer');

        window.addEventListener('load', async () => {
            initTeam();
            await syncWithServer();
            setInterval(syncWithServer, 10000);
        });

        function linkify(text) {
            if (!text) return "";
            let escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return escaped.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
        }

        function initTeam() {
            teamName = localStorage.getItem('syndicate_team_name') || "";
            teamPin = localStorage.getItem('syndicate_team_pin') || "";

            if (!teamName || !teamPin) {
                promptCredentials();
            } else {
                teamDisplay.textContent = teamName;
            }
        }

        function promptCredentials() {
            teamName = prompt("Введите название вашей команды:", teamName) || "";
            if (!teamName) teamName = "Команда_" + Math.floor(Math.random()*1000);
            
            teamPin = prompt("Введите ПИН-код вашей команды (4 цифры):", teamPin) || "";
            if (!teamPin) teamPin = "0000";

            localStorage.setItem('syndicate_team_name', teamName);
            localStorage.setItem('syndicate_team_pin', teamPin);
            teamDisplay.textContent = teamName;
        }

        document.getElementById('changeTeamBtn').addEventListener('click', () => {
            promptCredentials();
            syncWithServer();
        });

        async function syncWithServer(action = "") {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("ВАШ_СКРИПТ_ИД")) return;

            try {
                let url = `${GOOGLE_SCRIPT_URL}?team=${encodeURIComponent(teamName)}&pin=${encodeURIComponent(teamPin)}`;
                if (action) url += `&action=${action}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.status === "ERROR") {
                    taskTitle.textContent = "Ошибка авторизации";
                    taskText.textContent = data.message;
                    codeInput.disabled = true;
                    submitBtn.disabled = true;
                    hintContainer.style.display = "none";
                    return;
                }

                GAME_LEVELS = data.levels || [];
                currentLevel = data.currentLevel || 0;
                levelStartTime = data.levelStartTime || Date.now();
                hintsTaken = data.hintsTaken || 0;
                hint1DelayMs = data.hint1DelayMs || (10 * 60 * 1000);
                hint2DelayMs = data.hint2DelayMs || (20 * 60 * 1000);

                renderLevel();

                const now = Date.now();
                if (data.lockoutUntil && data.lockoutUntil > now) {
                    startLockoutTimer(data.lockoutUntil - now);
                } else if (isLocked) {
                    unlockInterface();
                } else if (data.wrongAttempts > 0) {
                    msgBox.className = "msg msg-err";
                    msgBox.textContent = `⚠️ Команда ошиблась! Осталось попыток: ${3 - data.wrongAttempts}`;
                } else {
                    msgBox.textContent = "";
                }
            } catch (err) {
                console.error("Ошибка синхронизации:", err);
            }
        }

        function renderLevel() {
            if (GAME_LEVELS.length === 0) return;

            if (currentLevel >= GAME_LEVELS.length) {
                taskTitle.textContent = "ИГРА ОКОНЧЕНА!";
                taskText.textContent = "🎉 Поздравляем! Все задания успешно выполнены!";
                document.getElementById('inputBlock').style.display = "none";
                hintContainer.style.display = "none";
                return;
            }

            const lvl = GAME_LEVELS[currentLevel];
            taskTitle.textContent = lvl.title;
            taskText.innerHTML = linkify(lvl.clue);

            updateHintsUI();

            if (!isLocked) {
                codeInput.disabled = false;
                submitBtn.disabled = false;
            }
        }

        function updateHintsUI() {
            if (GAME_LEVELS.length === 0 || currentLevel >= GAME_LEVELS.length) return;

            const lvl = GAME_LEVELS[currentLevel];

            if (hintsTaken >= 1 && lvl.hint1) {
                hint1Box.style.display = "block";
                hint1Box.innerHTML = "<strong>💡 Подсказка 1:</strong><br>" + linkify(lvl.hint1);
            } else {
                hint1Box.style.display = "none";
            }

            if (hintsTaken >= 2 && lvl.hint2) {
                hint2Box.style.display = "block";
                hint2Box.innerHTML = "<strong>🎯 Прямая наводка:</strong><br>" + linkify(lvl.hint2);
            } else {
                hint2Box.style.display = "none";
            }

            if (hintsTaken >= 2) {
                hintTimerInfo.textContent = "";
                hintBtn.style.display = "none";
            } else {
                hintBtn.style.display = "block";
                startHintTimer();
            }
        }

        function startHintTimer() {
            if (hintTimerInterval) clearInterval(hintTimerInterval);

            const tick = () => {
                const now = Date.now();
                const elapsed = now - levelStartTime;

                if (hintsTaken === 0) {
                    const left = hint1DelayMs - elapsed;
                    if (left <= 0) {
                        hintTimerInfo.textContent = "💡 Доступна Подсказка 1!";
                        hintBtn.disabled = false;
                        hintBtn.textContent = "ВЗЯТЬ ПОДСКАЗКУ 1";
                        hintBtn.style.background = "#00bfff";
                        hintBtn.style.color = "#000";
                    } else {
                        const mins = Math.floor(left / 60000);
                        const secs = Math.floor((left % 60000) / 1000);
                        hintTimerInfo.textContent = `⏱ Подсказка 1 доступна через ${mins}:${secs < 10 ? '0' : ''}${secs}`;
                        hintBtn.disabled = true;
                        hintBtn.textContent = "ПОДСКАЗКА 1 (ЗАБЛОКИРОВАНО)";
                        hintBtn.style.background = "#2a303c";
                        hintBtn.style.color = "#666";
                    }
                } else if (hintsTaken === 1) {
                    const left = hint2DelayMs - elapsed;
                    if (left <= 0) {
                        hintTimerInfo.textContent = "🎯 Доступна Прямая наводка!";
                        hintBtn.disabled = false;
                        hintBtn.textContent = "ВЗЯТЬ ПРЯМУЮ НАВОДКУ";
                        hintBtn.style.background = "#ff4d4d";
                        hintBtn.style.color = "#fff";
                    } else {
                        const mins = Math.floor(left / 60000);
                        const secs = Math.floor((left % 60000) / 1000);
                        hintTimerInfo.textContent = `⏱ Прямая наводка доступна через ${mins}:${secs < 10 ? '0' : ''}${secs}`;
                        hintBtn.disabled = true;
                        hintBtn.textContent = "ПРЯМАЯ НАВОДКА (ЗАБЛОКИРОВАНО)";
                        hintBtn.style.background = "#2a303c";
                        hintBtn.style.color = "#666";
                    }
                }
            };

            tick();
            hintTimerInterval = setInterval(tick, 1000);
        }

        hintBtn.addEventListener('click', async () => {
            if (hintBtn.disabled) return;
            hintBtn.disabled = true;
            hintBtn.textContent = "⏳ Получение...";
            await syncWithServer("takeHint");
        });

        function startLockoutTimer(durationMs) {
            isLocked = true;
            codeInput.disabled = true;
            submitBtn.disabled = true;

            const endTime = Date.now() + durationMs;
            if (lockoutTimer) clearInterval(lockoutTimer);

            lockoutTimer = setInterval(() => {
                const left = endTime - Date.now();
                if (left <= 0) {
                    unlockInterface();
                } else {
                    const minutes = Math.floor(left / 60000);
                    const seconds = Math.floor((left % 60000) / 1000);
                    msgBox.className = "msg msg-err";
                    msgBox.textContent = `🚫 КОМАНДНЫЙ ШТРАФ! Блокировка: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        function unlockInterface() {
            if (lockoutTimer) clearInterval(lockoutTimer);
            isLocked = false;
            codeInput.disabled = false;
            submitBtn.disabled = false;
            msgBox.className = "msg";
            msgBox.textContent = "";
        }

        function getCoordinates() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve({ coords: "Не поддерживается", mapUrl: "—" });
                    return;
                }

                let resolved = false;
                const timer = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        resolve({ coords: "Таймаут GPS", mapUrl: "—" });
                    }
                }, 2500);

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(timer);
                            const lat = pos.coords.latitude.toFixed(6);
                            const lng = pos.coords.longitude.toFixed(6);
                            resolve({
                                coords: `${lat}, ${lng}`,
                                mapUrl: `https://maps.yandex.ru/?text=${lat},${lng}`
                            });
                        }
                    },
                    () => {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(timer);
                            resolve({ coords: "GPS выключен", mapUrl: "—" });
                        }
                    },
                    { enableHighAccuracy: true, timeout: 2000, maximumAge: 0 }
                );
            });
        }

        // ОТПРАВКА КОДА
        submitBtn.addEventListener('click', async () => {
            if (codeInput.disabled || isLocked) return;
            const userCode = codeInput.value.trim();

            if (!userCode) {
                msgBox.className = "msg msg-err";
                msgBox.textContent = "Введите код!";
                return;
            }

            submitBtn.disabled = true;
            codeInput.disabled = true;
            msgBox.className = "msg";
            msgBox.style.color = "#a8b2d1";
            msgBox.textContent = "⏳ Проверка кода...";

            try {
                const geoData = await getCoordinates();

                let url = `${GOOGLE_SCRIPT_URL}?action=submitCode&team=${encodeURIComponent(teamName)}&pin=${encodeURIComponent(teamPin)}&code=${encodeURIComponent(userCode)}&coords=${encodeURIComponent(geoData.coords)}&mapUrl=${encodeURIComponent(geoData.mapUrl)}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.status === "ERROR") {
                    msgBox.className = "msg msg-err";
                    msgBox.textContent = data.message;
                    submitBtn.disabled = false;
                    codeInput.disabled = false;
                    return;
                }

                if (data.result === "CORRECT") {
                    msgBox.className = "msg msg-ok";
                    msgBox.textContent = data.message || "🎉 Код верный!";
                    codeInput.value = "";

                    // Мгновенное обновление уровня из ответа сервера
                    if (data.levels) GAME_LEVELS = data.levels;
                    if (data.currentLevel !== undefined) currentLevel = data.currentLevel;
                    if (data.levelStartTime) levelStartTime = data.levelStartTime;
                    hintsTaken = data.hintsTaken || 0;

                    renderLevel();

                    setTimeout(() => {
                        msgBox.textContent = "";
                    }, 2500);

                } else if (data.result === "WRONG") {
                    codeInput.value = "";
                    if (data.lockoutMs > 0) {
                        startLockoutTimer(data.lockoutMs);
                    } else {
                        msgBox.className = "msg msg-err";
                        msgBox.textContent = `❌ Неверный код! Осталось попыток: ${3 - data.wrongAttempts}`;
                        submitBtn.disabled = false;
                        codeInput.disabled = false;
                    }
                } else if (data.result === "FINISHED") {
                    msgBox.className = "msg msg-ok";
                    msgBox.textContent = "Игра уже завершена!";
                }

            } catch (err) {
                console.error("Ошибка проверки кода:", err);
                msgBox.className = "msg msg-err";
                msgBox.textContent = "Ошибка связи с сервером. Попробуйте ещё раз.";
                submitBtn.disabled = false;
                codeInput.disabled = false;
            }
        });
    </script>
</body>
</html>
