<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игровой Терминал</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0f12;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: #161a20;
            border: 1px solid #2a303c;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .team-bar {
            font-size: 0.85rem;
            color: #8892b0;
            border-bottom: 1px solid #2a303c;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .task-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 12px;
        }
        .task-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #ffffff;
            white-space: pre-line;
            background: #0f1217;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
            margin-bottom: 25px;
            word-break: break-word;
        }
        /* Стилизация ссылок в задании */
        .task-text a {
            color: #00ff66;
            text-decoration: underline;
            font-weight: 600;
            word-break: break-all;
        }
        .task-text a:active {
            color: #ffcc00;
        }
        .prompt-text {
            font-size: 0.95rem;
            color: #a8b2d1;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .code-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            background: #090b0e;
            border: 2px solid #2a303c;
            color: #00ff66;
            text-align: center;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        .code-input:focus {
            border-color: #ffcc00;
        }
        .code-input:disabled {
            background: #1f242d;
            color: #555;
            border-color: #333;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #ffcc00;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn:active:not(:disabled) {
            background: #e6b800;
            transform: scale(0.99);
        }
        .msg {
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            min-height: 24px;
            font-weight: 600;
        }
        .msg-err { color: #ff4d4d; }
        .msg-ok { color: #00ff66; }
        .reset-btn {
            background: none;
            border: none;
            color: #444c5e;
            text-decoration: underline;
            font-size: 0.75rem;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Информация о команде -->
        <div class="team-bar">
            <span>Команда: <strong id="teamDisplay" style="color: #fff;">—</strong></span>
            <span id="changeTeamBtn" style="cursor:pointer; text-decoration:underline;">Сменить</span>
        </div>

        <!-- Заголовок задания -->
        <div id="taskTitle" class="task-title">Загрузка...</div>

        <!-- Текст задания -->
        <div id="taskText" class="task-text">⏳ Получение заданий из сервера...</div>

        <!-- Ввод кода -->
        <div class="prompt-text">Для получения следующего задания введите код:</div>
        <input type="text" id="codeInput" class="code-input" placeholder="Введите код..." autocomplete="off">
        <button id="submitBtn" class="btn">ОТПРАВИТЬ КОД</button>
        <div id="msgBox" class="msg"></div>

        <button id="resetBtn" class="reset-btn">Сбросить прогресс (для оргов)</button>
    </div>

    <script>
        // =================================================================
        // ССЫЛКА НА GOOGLE APPS SCRIPT
        // =================================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymyo45TOB3pzo61x6Vk4v1cG0URU69Xvcv6JsdvjqFzm9MYPDfiucojmM9FpE6igx9Tw/exec";

        let GAME_LEVELS = [];
        let currentLevel = 0;
        let teamName = "";
        let wrongAttempts = 0;
        let lockoutTimer = null;

        const taskTitle = document.getElementById('taskTitle');
        const taskText = document.getElementById('taskText');
        const codeInput = document.getElementById('codeInput');
        const submitBtn = document.getElementById('submitBtn');
        const msgBox = document.getElementById('msgBox');
        const teamDisplay = document.getElementById('teamDisplay');

        window.addEventListener('load', async () => {
            initTeam();
            loadProgress();
            await fetchLevelsFromGoogle();
            renderLevel();
            checkLockoutState();
        });

        // Функция поиска сырых ссылок и превращения их в HTML <a> теги
        function linkify(text) {
            if (!text) return "";
            
            // Безопасное экранирование спецсимволов HTML
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Регулярное выражение для поиска всех http:// и https:// ссылок
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            
            return escaped.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        function getStorageKeyAttempts() {
            return `syndicate_wrong_attempts_${currentLevel}`;
        }
        function getStorageKeyLockout() {
            return `syndicate_lockout_until_${currentLevel}`;
        }

        function checkLockoutState() {
            const lockoutUntil = localStorage.getItem(getStorageKeyLockout());
            if (lockoutUntil) {
                const timeLeft = parseInt(lockoutUntil) - Date.now();
                if (timeLeft > 0) {
                    startLockoutTimer(timeLeft);
                } else {
                    localStorage.removeItem(getStorageKeyLockout());
                    localStorage.removeItem(getStorageKeyAttempts());
                    wrongAttempts = 0;
                }
            } else {
                wrongAttempts = parseInt(localStorage.getItem(getStorageKeyAttempts()) || "0");
            }
        }

        function startLockoutTimer(durationMs) {
            codeInput.disabled = true;
            submitBtn.disabled = true;

            const endTime = Date.now() + durationMs;
            localStorage.setItem(getStorageKeyLockout(), endTime);

            if (lockoutTimer) clearInterval(lockoutTimer);

            lockoutTimer = setInterval(() => {
                const left = endTime - Date.now();
                if (left <= 0) {
                    clearInterval(lockoutTimer);
                    localStorage.removeItem(getStorageKeyLockout());
                    localStorage.removeItem(getStorageKeyAttempts());
                    wrongAttempts = 0;
                    
                    codeInput.disabled = false;
                    submitBtn.disabled = false;
                    msgBox.className = "msg";
                    msgBox.textContent = "";
                } else {
                    const minutes = Math.floor(left / 60000);
                    const seconds = Math.floor((left % 60000) / 1000);
                    msgBox.className = "msg msg-err";
                    msgBox.textContent = `🚫 Штраф! Блокировка ввода: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        async function fetchLevelsFromGoogle() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    GAME_LEVELS = data;
                } else {
                    taskText.textContent = "⚠️ Ошибка: вкладка 'Задания' пуста или не найдена.";
                }
            } catch (err) {
                console.error("Ошибка загрузки:", err);
                taskText.textContent = "⚠️ Ошибка подключения к серверу заданий. Проверьте интернет.";
            }
        }

        function initTeam() {
            teamName = localStorage.getItem('syndicate_team_name') || "";
            if (!teamName) {
                teamName = prompt("Введите название вашей команды:") || "Анонимы";
                localStorage.setItem('syndicate_team_name', teamName);
            }
            teamDisplay.textContent = teamName;
        }

        document.getElementById('changeTeamBtn').addEventListener('click', () => {
            const newName = prompt("Введите новое название команды:", teamName);
            if (newName) {
                teamName = newName;
                localStorage.setItem('syndicate_team_name', teamName);
                teamDisplay.textContent = teamName;
            }
        });

        function saveProgress() {
            localStorage.setItem('syndicate_current_level', currentLevel);
        }

        function loadProgress() {
            const savedLvl = localStorage.getItem('syndicate_current_level');
            if (savedLvl !== null) currentLevel = parseInt(savedLvl);
        }

        function renderLevel() {
            if (GAME_LEVELS.length === 0) return;

            if (currentLevel >= GAME_LEVELS.length) {
                taskTitle.textContent = "ИГРА ОКОНЧЕНА!";
                taskText.textContent = "🎉 Поздравляем! Все задания успешно выполнены, время зафиксировано у ведущего!";
                codeInput.style.display = "none";
                submitBtn.style.display = "none";
                document.querySelector('.prompt-text').style.display = "none";
                return;
            }

            const lvl = GAME_LEVELS[currentLevel];
            taskTitle.textContent = lvl.title;
            // Использование innerHTML вместе с функцией linkify для рендеринга кликабельных ссылок
            taskText.innerHTML = linkify(lvl.clue);
            
            checkLockoutState();
        }

        function getCoordinates() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve({ coords: "Не поддерживается", mapUrl: "—" });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude.toFixed(6);
                        const lng = pos.coords.longitude.toFixed(6);
                        resolve({
                            coords: `${lat}, ${lng}`,
                            mapUrl: `https://maps.yandex.ru/?text=${lat},${lng}`
                        });
                    },
                    (err) => {
                        resolve({ coords: "GPS выключен/запрещен", mapUrl: "—" });
                    },
                    { enableHighAccuracy: true, timeout: 3500, maximumAge: 0 }
                );
            });
        }

        function sendResultToHost(levelTitle, userCode, isCorrect, geoData) {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("ВАШ_СКРИПТ_ИД")) return;

            const payload = JSON.stringify({
                team: teamName,
                level: levelTitle,
                code: userCode,
                status: isCorrect ? "ВЕРНО" : "НЕВЕРНО",
                coords: geoData.coords,
                mapUrl: geoData.mapUrl
            });

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: payload
            }).catch(err => console.log("Ошибка отправки:", err));
        }

        submitBtn.addEventListener('click', async () => {
            if (codeInput.disabled) return;
            const userCode = codeInput.value.trim().toUpperCase();
            if (GAME_LEVELS.length === 0) return;
            const targetLevel = GAME_LEVELS[currentLevel];

            if (!userCode) {
                msgBox.className = "msg msg-err";
                msgBox.textContent = "Введите код!";
                return;
            }

            submitBtn.disabled = true;
            codeInput.disabled = true;
            msgBox.className = "msg";
            msgBox.style.color = "#a8b2d1";
            msgBox.textContent = "⏳ Фиксация GPS и отправка...";

            const geoData = await getCoordinates();

            if (userCode === targetLevel.code.toUpperCase()) {
                msgBox.className = "msg msg-ok";
                msgBox.textContent = "✅ Код принят! Данные зафиксированы.";
                
                sendResultToHost(targetLevel.title, userCode, true, geoData);

                localStorage.removeItem(getStorageKeyAttempts());
                localStorage.removeItem(getStorageKeyLockout());
                wrongAttempts = 0;

                codeInput.value = "";
                currentLevel++;
                saveProgress();

                setTimeout(() => {
                    msgBox.textContent = "";
                    codeInput.disabled = false;
                    submitBtn.disabled = false;
                    renderLevel();
                }, 1500);
            } else {
                wrongAttempts++;
                localStorage.setItem(getStorageKeyAttempts(), wrongAttempts);

                sendResultToHost(targetLevel.title, userCode, false, geoData);

                if (wrongAttempts >= 3) {
                    startLockoutTimer(5 * 60 * 1000);
                } else {
                    msgBox.className = "msg msg-err";
                    msgBox.textContent = `❌ Неверный код! Осталось попыток: ${3 - wrongAttempts}`;
                    codeInput.disabled = false;
                    submitBtn.disabled = false;
                }
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm("Сбросить текущий прогресс игры?")) {
                localStorage.clear();
                location.reload();
            }
        });
    </script>
</body>
</html>
