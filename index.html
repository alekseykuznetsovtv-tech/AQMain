<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игровой Терминал</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0f12;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: #161a20;
            border: 1px solid #2a303c;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .team-bar {
            font-size: 0.85rem;
            color: #8892b0;
            border-bottom: 1px solid #2a303c;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .task-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 12px;
        }
        .task-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #ffffff;
            white-space: pre-line;
            background: #0f1217;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
            margin-bottom: 25px;
            word-break: break-word;
        }
        .task-text a {
            color: #00ff66;
            text-decoration: underline;
            font-weight: 600;
            word-break: break-all;
        }
        .prompt-text {
            font-size: 0.95rem;
            color: #a8b2d1;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .code-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            background: #090b0e;
            border: 2px solid #2a303c;
            color: #00ff66;
            text-align: center;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            margin-bottom: 12px;
        }
        .code-input:disabled {
            background: #1f242d;
            color: #555;
            border-color: #333;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #ffcc00;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .msg {
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            min-height: 24px;
            font-weight: 600;
        }
        .msg-err { color: #ff4d4d; }
        .msg-ok { color: #00ff66; }
    </style>
</head>
<body>

    <div class="container">
        <div class="team-bar">
            <span>Команда: <strong id="teamDisplay" style="color: #fff;">—</strong></span>
            <span id="changeTeamBtn" style="cursor:pointer; text-decoration:underline;">Сменить</span>
        </div>

        <div id="taskTitle" class="task-title">Загрузка...</div>
        <div id="taskText" class="task-text">⏳ Подключение к серверу...</div>

        <div class="prompt-text">Для получения следующего задания введите код:</div>
        <input type="text" id="codeInput" class="code-input" placeholder="Введите код..." autocomplete="off">
        <button id="submitBtn" class="btn">ОТПРАВИТЬ КОД</button>
        <div id="msgBox" class="msg"></div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymyo45TOB3pzo61x6Vk4v1cG0URU69Xvcv6JsdvjqFzm9MYPDfiucojmM9FpE6igx9Tw/exec";

        let GAME_LEVELS = [];
        let currentLevel = 0;
        let teamName = "";
        let lockoutTimer = null;
        let isLocked = false;

        const taskTitle = document.getElementById('taskTitle');
        const taskText = document.getElementById('taskText');
        const codeInput = document.getElementById('codeInput');
        const submitBtn = document.getElementById('submitBtn');
        const msgBox = document.getElementById('msgBox');
        const teamDisplay = document.getElementById('teamDisplay');

        window.addEventListener('load', async () => {
            initTeam();
            await syncWithServer();
            // Фоновая синхронизация каждые 10 секунд
            setInterval(syncWithServer, 10000);
        });

        function linkify(text) {
            if (!text) return "";
            let escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return escaped.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
        }

        function initTeam() {
            teamName = localStorage.getItem('syndicate_team_name') || "";
            if (!teamName) {
                teamName = prompt("Введите название вашей команды:") || "Команда_" + Math.floor(Math.random()*1000);
                localStorage.setItem('syndicate_team_name', teamName);
            }
            teamDisplay.textContent = teamName;
        }

        document.getElementById('changeTeamBtn').addEventListener('click', () => {
            const newName = prompt("Введите новое название команды:", teamName);
            if (newName) {
                teamName = newName;
                localStorage.setItem('syndicate_team_name', teamName);
                teamDisplay.textContent = teamName;
                syncWithServer();
            }
        });

        async function syncWithServer() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("ВАШ_СКРИПТ_ИД")) return;

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?team=${encodeURIComponent(teamName)}`);
                const data = await response.json();

                GAME_LEVELS = data.levels || [];
                currentLevel = data.currentLevel || 0;

                renderLevel();

                // Проверка командного блокирования
                const now = Date.now();
                if (data.lockoutUntil && data.lockoutUntil > now) {
                    startLockoutTimer(data.lockoutUntil - now);
                } else if (isLocked) {
                    unlockInterface();
                } else if (data.wrongAttempts > 0) {
                    msgBox.className = "msg msg-err";
                    msgBox.textContent = `⚠️ Команда ошибласть! Осталось попыток: ${3 - data.wrongAttempts}`;
                }
            } catch (err) {
                console.error("Ошибка синхронизации:", err);
            }
        }

        function startLockoutTimer(durationMs) {
            isLocked = true;
            codeInput.disabled = true;
            submitBtn.disabled = true;

            const endTime = Date.now() + durationMs;

            if (lockoutTimer) clearInterval(lockoutTimer);

            lockoutTimer = setInterval(() => {
                const left = endTime - Date.now();
                if (left <= 0) {
                    unlockInterface();
                } else {
                    const minutes = Math.floor(left / 60000);
                    const seconds = Math.floor((left % 60000) / 1000);
                    msgBox.className = "msg msg-err";
                    msgBox.textContent = `🚫 КОМАНДНЫЙ ШТРАФ! Блокировка: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        function unlockInterface() {
            if (lockoutTimer) clearInterval(lockoutTimer);
            isLocked = false;
            codeInput.disabled = false;
            submitBtn.disabled = false;
            msgBox.className = "msg";
            msgBox.textContent = "";
        }

        function renderLevel() {
            if (GAME_LEVELS.length === 0) return;

            if (currentLevel >= GAME_LEVELS.length) {
                taskTitle.textContent = "ИГРА ОКОНЧЕНА!";
                taskText.textContent = "🎉 Поздравляем! Все задания успешно выполнены!";
                codeInput.style.display = "none";
                submitBtn.style.display = "none";
                document.querySelector('.prompt-text').style.display = "none";
                return;
            }

            const lvl = GAME_LEVELS[currentLevel];
            taskTitle.textContent = lvl.title;
            taskText.innerHTML = linkify(lvl.clue);
        }

        function getCoordinates() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve({ coords: "Не поддерживается", mapUrl: "—" });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude.toFixed(6);
                        const lng = pos.coords.longitude.toFixed(6);
                        resolve({
                            coords: `${lat}, ${lng}`,
                            mapUrl: `https://maps.yandex.ru/?text=${lat},${lng}`
                        });
                    },
                    () => resolve({ coords: "GPS выключен", mapUrl: "—" }),
                    { enableHighAccuracy: true, timeout: 3500, maximumAge: 0 }
                );
            });
        }

        submitBtn.addEventListener('click', async () => {
            if (codeInput.disabled || isLocked) return;
            const userCode = codeInput.value.trim().toUpperCase();
            if (GAME_LEVELS.length === 0) return;

            const targetLevel = GAME_LEVELS[currentLevel];

            if (!userCode) {
                msgBox.className = "msg msg-err";
                msgBox.textContent = "Введите код!";
                return;
            }

            submitBtn.disabled = true;
            codeInput.disabled = true;
            msgBox.className = "msg";
            msgBox.style.color = "#a8b2d1";
            msgBox.textContent = "⏳ Проверка кода...";

            const geoData = await getCoordinates();
            const isCorrect = (userCode === targetLevel.code.toUpperCase());

            const payload = JSON.stringify({
                team: teamName,
                level: targetLevel.title,
                code: userCode,
                status: isCorrect ? "ВЕРНО" : "НЕВЕРНО",
                coords: geoData.coords,
                mapUrl: geoData.mapUrl
            });

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: payload
                });

                codeInput.value = "";
                // Сразу запрашиваем обновленный статус с сервера
                setTimeout(async () => {
                    await syncWithServer();
                    if (!isLocked) {
                        codeInput.disabled = false;
                        submitBtn.disabled = false;
                    }
                }, 1000);

            } catch (err) {
                console.error("Ошибка отправки:", err);
                submitBtn.disabled = false;
                codeInput.disabled = false;
            }
        });
    </script>
</body>
</html>
